apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: kdelta
build:
  artifacts:
    - image: ghcr.io/shadiramadan/kdelta
      docker:
        dockerfile: Dockerfile
manifests:
  kustomize:
    paths:
      - infra/kustomize/base
deploy:
  kubectl: {}
portForward:
  - resourceType: service
    resourceName: kdelta
    namespace: kdelta
    port: 80
    localPort: 8080
profiles:
  # The demo overlay needs ksops (sops-encrypted tunnel token) and the
  # restricted PGP key in the invoking user's keyring.
  #
  # The overlay pins the released image by digest, pulled from the public
  # registry, so demo deploys need no image side-loading:
  #   skaffold deploy -p demo --images ghcr.io/shadiramadan/kdelta@<digest>
  # Iterating on an UNRELEASED build against a remote kind cluster is the
  # awkward case: kind locates node containers through the Docker daemon
  # (never the kubeconfig), and skaffold's post-build kind image-load hangs
  # over an ssh DOCKER_HOST — run skaffold ON the demo host, or side-load
  # manually (docker save | ssh docker load && ssh kind load docker-image).
  - name: demo
    manifests:
      kustomize:
        paths:
          - infra/kustomize/overlays/demo
        buildArgs:
          - --enable-alpha-plugins
          - --enable-exec
