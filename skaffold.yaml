apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: kdelta
build:
  artifacts:
    - image: ghcr.io/shadiramadan/kdelta
      docker:
        dockerfile: Dockerfile
manifests:
  kustomize:
    paths:
      - infra/kustomize/base
deploy:
  kubectl: {}
portForward:
  - resourceType: service
    resourceName: kdelta
    namespace: kdelta
    port: 80
    localPort: 8080
profiles:
  # The demo overlay needs ksops (sops-encrypted tunnel token) and the
  # restricted PGP key in the invoking user's keyring.
  #
  # Remote kind cluster: kind locates node containers through the Docker
  # daemon (never the kubeconfig). With DOCKER_HOST=ssh://<demo-host> the
  # build runs natively on the demo host and `kind get clusters` resolves,
  # but skaffold's post-build kind image-load hangs over the ssh transport —
  # run skaffold ON the demo host for the full loop, or load the image
  # manually (docker save | ssh docker load && ssh kind load docker-image)
  # and apply the rendered overlay. Publishing images to a registry removes
  # the load step entirely.
  - name: demo
    manifests:
      kustomize:
        paths:
          - infra/kustomize/overlays/demo
        buildArgs:
          - --enable-alpha-plugins
          - --enable-exec
