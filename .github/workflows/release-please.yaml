name: release-please
on:
  push:
    branches: [main]

# Everything release-please does uses the app token minted below, so the
# workflow's own GITHUB_TOKEN needs no permissions at all.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A GitHub App installation token instead of GITHUB_TOKEN: events
      # created with the default token never trigger other workflows, so
      # releases cut with it would not start publish.yaml. The app is
      # installed on this repository only, with contents, pull-requests, and
      # issues write access.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
