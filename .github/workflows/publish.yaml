name: publish
on:
  release:
    types: [published]
  # Manual fallback: releases cut by release-please with the default
  # GITHUB_TOKEN don't emit workflow-triggering events. Run this from the
  # release tag until a PAT/App token automates the chain (see ROADMAP).
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write # sbom-action uploads the SBOM as a release asset
      actions: read
      packages: write
      id-token: write # cosign keyless OIDC
      attestations: write # build provenance
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so Go's VCS stamping sees the release tag.
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SBOM, signature, and provenance for the pushed digest.
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
      # Fail the release on a high/critical CVE in the SBOM (grype auto-updates
      # its vuln DB). Same check as `task scan:cve` locally.
      - uses: anchore/scan-action@v6
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: high
      # Moving major tags stop at v3 for this action; v4 must be pinned exactly.
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign image (keyless)
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release asset
    steps:
      - uses: actions/checkout@v7
      - name: Render deployable manifest
        run: kubectl kustomize infra/kustomize/base > kdelta-manifest.yaml
      - name: Attach manifest to release
        # ref_name is the tag for both release events and tag-dispatched runs.
        run: gh release upload "${{ github.ref_name }}" kdelta-manifest.yaml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
