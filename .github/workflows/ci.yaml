name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.13.1/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.13.1

      - run: pnpm install --frozen-lockfile
      # The same Taskfile targets contributors run locally.
      - run: task generate:check
      - run: task lint
      - name: Proto breaking-change check
        if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/${{ github.repository }}.git"
      - run: task test
      - run: task build
      - run: task marketing:build

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/go.out
