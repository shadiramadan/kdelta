# Keep the pinned action SHAs, module deps, workspace packages, and base
# images current. Minor/patch bumps are grouped to keep PR noise down.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # fix-typed so module bumps (often CVE fixes in the shipped binary)
    # trigger a release-please patch release; actions/npm bumps stay build-typed.
    commit-message:
      prefix: fix
      include: scope
    groups:
      go-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      js-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
