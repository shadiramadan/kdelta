# ksops generator: builds the tunnel-token Secret from the sops-encrypted
# dotenv payload in secrets/restricted/ (classification lives in the path,
# so the file name stays the same across overlays/classes).
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: cloudflared-token-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
secretFrom:
  # Paths resolve from the overlay root (the KRM exec working directory).
  # Only .enc.env files are committed; `task sops:encrypt` produces them from
  # the git-ignored plaintext siblings.
  - metadata:
      name: kdelta-demo-tunnel-token
    type: Opaque
    envs:
      - ./secrets/restricted/cloudflared-token.enc.env
  # Claude subscription token for the agent runner (claude setup-token).
  - metadata:
      name: kdelta-claude-token
    type: Opaque
    envs:
      - ./secrets/restricted/claude-token.enc.env
